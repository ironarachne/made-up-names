name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Releasing version $pkg"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # registry-url is deliberately omitted. It makes setup-node write an
      # .npmrc holding a NODE_AUTH_TOKEN placeholder and a deprecated
      # always-auth key, neither of which trusted publishing uses. npm
      # already defaults to registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          # npm 11.5.1+ is required to exchange the OIDC token for a
          # publish credential. Node 24.x bundles it; Node 22.x ships npm 10.
          node-version: 24.x
          cache: npm
      - run: npm ci

      # Authenticates via OIDC using the trusted publisher configured on
      # npmjs.com for this repository and workflow. No token involved.
      - run: npm publish

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
